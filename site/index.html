<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Altair 8800 — Browser Emulator</title><link rel="stylesheet" href="./style.css"></head><body><header><div><h1>ALTAIR 8800</h1><p>8080 microcomputer browser emulator</p></div><a href="https://github.com/ArkansasIo/altair-8800">Source on GitHub</a></header><main><section class="panel front"><h2>FRONT PANEL</h2><div class="leds" id="leds"></div><div class="switches" id="switches"></div><div class="controls"><button id="reset">RESET</button><button id="run">RUN</button><button id="step">SINGLE STEP</button><button id="stop">STOP</button></div></section><section class="grid"><div class="panel"><h2>CPU</h2><pre id="regs"></pre></div><div class="panel"><h2>MEMORY</h2><div class="row"><input id="address" value="0000" maxlength="4"><button id="peek">PEEK</button><button id="poke">POKE</button></div><pre id="memory"></pre></div><div class="panel"><h2>CONSOLE</h2><pre id="console"></pre><div class="row"><input id="program" placeholder="8080 hex bytes, e.g. 3E 41 D3 00 76"><button id="load">LOAD @ 0000</button></div></div><div class="panel"><h2>DISASSEMBLY VIEW</h2><pre id="disasm"></pre></div></section></main><footer>Browser implementation informed by the repository Intel 8080 core, memory/I/O model, and diagnostic programs. Native Arduino/desktop targets remain in the repository.</footer><script type="module" src="./emulator.js"></script></body></html>
